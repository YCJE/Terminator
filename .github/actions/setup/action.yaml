name: Setup
runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.0'

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        # 不显式指定 version：package.json 中已声明 packageManager，
        # 同时传入 version 会触发 ERR_PNPM_BAD_PM_VERSION 导致构建直接失败。
        package_json_file: 'frontend/package.json'
        cache_dependency_path: 'frontend/pnpm-lock.yaml'

    - name: Run pnpm setup
      shell: bash
      run: |
        pnpm setup

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: 'frontend/pnpm-lock.yaml'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Install Wails v3 CLI
      # 必须与 go.mod 中的 github.com/wailsapp/wails/v3 版本一致：CLI 负责
      # `wails3 generate bindings`，版本不一致会生成与前端 import 不兼容的绑定
      # （曾用 @latest 导致 alpha 版升级后 bindings 结构变化，前端 tsc 直接失败）。
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.78
      shell: bash

    - name: Get version
      id: get_version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      shell: bash