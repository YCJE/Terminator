name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (vet / gofmt / test)
    # 使用 Windows runner：wails v3 alpha 的 Linux 实现分为 cgo 与 purego 两套，
    # 前者需要 cgo、后者需要 purego 构建标签，而 purego 变体在当前版本自身存在
    # 编译错误。CGO_ENABLED=0 的 Linux 环境下 cmd/terminator-desktop 无法编译，
    # 会使 go vet ./... 报 undefined: pointer / linuxApp。桌面端以 Windows 为主，
    # 在此平台上可对 ./... 做完整校验。
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 根包 embed.go 用 //go:embed all:frontend/dist 内嵌前端产物，
      # 而 frontend/dist 被 gitignore、CI 上不存在；缺失时 go vet ./... 会因
      # 编译根包失败。这里仅放置占位文件让编译通过，真实产物由前端构建产出。
      - name: Stub frontend/dist for go:embed
        shell: bash
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html><meta charset="utf-8"><title>ci</title>\n' > frontend/dist/index.html

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true

      # GitHub 托管 Windows runner 默认开启 Defender 实时防护。go test 会把每个
      # 测试包编译成临时 *.test.exe，其中涉及密码哈希/压缩的二进制会被误判并隔离，
      # 表现为 fork/exec ...\.test.exe: Access is denied / cannot find the file。
      # 将 Go 构建临时目录与工作区加入白名单，避免测试二进制被防护拦截。
      - name: Configure Defender exclusions
        shell: pwsh
        run: |
          $paths = @($env:TEMP, $env:GITHUB_WORKSPACE, (go env GOCACHE), (go env GOTMPDIR)) |
            Where-Object { $_ -and (Test-Path $_) }
          foreach ($p in $paths) {
            Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue
          }
          Add-MpPreference -ExclusionProcess 'go.exe' -ErrorAction SilentlyContinue
          Write-Host "Defender 排除目录：$($paths -join ', ')"

      # CGO 关闭：与发布构建保持一致，且无需安装 gcc/系统库，
      # velopack 的更新能力在无 cgo 时会优雅降级。
      - name: gofmt
        # Windows runner 默认 shell 为 PowerShell，此步骤沿用 bash 脚本
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt，请本地运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: go test
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./... 2>&1 | tee go-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # CI 运行日志需登录才能查看，而 check-run 的 annotation 公开可读；
            # 把失败摘要折叠进单条 annotation，便于在外部定位失败包与原因。
            body="$(grep -E '^(FAIL|fork/exec|--- FAIL)' go-test.log | head -n 30)"
            body="${body//'%'/'%25'}"
            body="${body//$'\r'/'%0D'}"
            body="${body//$'\n'/'%0A'}"
            echo "::error::go test 未通过（exit $status）%0A$body"
            exit 1
          fi

  frontend:
    name: Frontend (tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # 不显式指定 version：package.json 中已声明 packageManager，
          # 同时传入 version 会触发 ERR_PNPM_BAD_PM_VERSION 导致失败。
          package_json_file: 'frontend/package.json'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      # en/zh 语言包键集合必须一致：漏键时界面会直接显示原始 key，
      # 而 tsc 与构建都不会报错
      - name: i18n key parity
        working-directory: frontend
        run: pnpm check:i18n