name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # windows-latest 已切换到 Windows Server 2025 镜像，该镜像不再预装 NSIS，
      # 而安装包由 package 链路的 create:nsis:installer 调用 makensis 生成
      # （Windows Server 2022 镜像自带 NSIS 3.10，因此旧版本发布未暴露此问题）。
      # 这里显式安装，并把 makensis 所在目录写入 PATH 供后续任务使用。
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) {
            throw "NSIS 安装失败：$nsis\makensis.exe 不存在"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis -Encoding ascii

      # 必须用 package 而不是 build：build 只产出免安装版 terminator.exe，
      # NSIS 安装包由 package 链路的 create:nsis:installer 生成，
      # 而下面的发布步骤要同时上传这两个文件。
      - name: Build Wails App
        run: wails3 task package
        env:
          CGO_ENABLED: 1

      # 独立可执行文件（免安装版 + NSIS 安装包）是用户手动下载的主要入口，
      # 与历史版本的发布资产口径保持一致（应用内更新器另走 Velopack 产物）。
      # 放在 Velopack 之前：即使 Velopack 步骤失败，这两份文件也已完成发布。
      - name: Publish standalone executables
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ env.VERSION }}"
          NOTES="RELEASE_NOTES_v${{ env.VERSION }}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 发布可能已由失败重跑或手动创建，这里确保正文使用仓库中的发布说明
            if [ -f "$NOTES" ]; then
              gh release edit "$TAG" --notes-file "$NOTES"
            fi
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" \
            bin/terminator.exe \
            bin/terminator-amd64-installer.exe \
            --clobber
          # 发布可能已被其它平台任务以草稿形式创建，这里在两个安装包就位后再对外公开
          gh release edit "$TAG" --draft=false

      - name: Velopack
        shell: bash
        run: |
          dotnet tool install -g vpk
          
          vpk download github \
            --repoUrl "https://github.com/YCJE/Terminator" \
            --channel windows-stable \
            --token "${{ github.token }}" \
            --outputDir releases || true
          
          vpk pack \
            --packId "Terminator" \
            --packVersion "${{ env.VERSION }}" \
            --packDir "bin" \
            --mainExe "terminator.exe" \
            --packTitle "Terminator" \
            --packAuthors "Terminator SSH" \
            --channel windows-stable \
            --icon "build/windows/icon.ico" \
            --outputDir releases

      - name: Get green checkmark
        uses: actions/attest@v4
        with:
          subject-path: |
            releases/*

      - name: Upload
        shell: bash
        run: |
          vpk upload github \
            --repoUrl "https://github.com/YCJE/Terminator" \
            --channel windows-stable \
            --token "${{ github.token }}" \
            --outputDir releases \
            --merge \
            --tag "v${{ env.VERSION }}"

      - name: Generate checksums
        shell: bash
        run: |
          cd releases
          # 生成除校验和文件自身外所有发布资产的 SHA256，供客户端校验下载完整性
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS-*' -printf '%f\n' | sort | while read -r f; do sha256sum "$f"; done > SHA256SUMS-windows.txt

      - name: Upload checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ env.VERSION }}" releases/SHA256SUMS-windows.txt --clobber

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - uses: ./.github/actions/setup

      - name: Build Wails App
        run: wails3 task build
        env:
          CGO_ENABLED: 1

      - name: Velopack
        shell: bash
        run: |
          dotnet tool install -g vpk
          
          vpk download github \
            --repoUrl "https://github.com/YCJE/Terminator" \
            --channel linux-stable \
            --token "${{ github.token }}" \
            --outputDir releases || true
          
          vpk pack \
            --packId "Terminator" \
            --packVersion "${{ env.VERSION }}" \
            --packDir "bin" \
            --mainExe "terminator" \
            --packTitle "Terminator" \
            --packAuthors "Terminator SSH" \
            --channel linux-stable \
            --icon "build/appicon.png" \
            --outputDir releases

      - name: Get green checkmark
        uses: actions/attest@v4
        with:
          subject-path: |
            releases/*

      - name: Upload
        shell: bash
        run: |
          vpk upload github \
            --repoUrl "https://github.com/YCJE/Terminator" \
            --channel linux-stable \
            --token "${{ github.token }}" \
            --outputDir releases \
            --merge \
            --tag "v${{ env.VERSION }}"

      - name: Generate checksums
        shell: bash
        run: |
          cd releases
          # 生成除校验和文件自身外所有发布资产的 SHA256，供客户端校验下载完整性
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS-*' -printf '%f\n' | sort | while read -r f; do sha256sum "$f"; done > SHA256SUMS-linux.txt

      - name: Upload checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ env.VERSION }}" releases/SHA256SUMS-linux.txt --clobber

  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Build Wails App
        run: wails3 task package
        env:
          CGO_ENABLED: 1

      - name: Velopack
        shell: bash
        run: |
          dotnet tool install -g vpk
          
          vpk download github \
            --repoUrl "https://github.com/YCJE/Terminator" \
            --channel macos-stable \
            --token "${{ github.token }}" \
            --outputDir releases || true
          
          APP_BUNDLE=$(find bin -maxdepth 1 -name "*.app" | head -n 1)
          
          vpk pack \
            --packId "Terminator" \
            --packVersion "${{ env.VERSION }}" \
            --packDir "$APP_BUNDLE" \
            --mainExe "terminator" \
            --packTitle "Terminator" \
            --packAuthors "Terminator SSH" \
            --channel macos-stable \
            --runtime osx-arm64 \
            --icon "build/darwin/icons.icns" \
            --outputDir releases

      - name: Get green checkmark
        uses: actions/attest@v4
        with:
          subject-path: |
            releases/*

      - name: Upload
        shell: bash
        run: |
          vpk upload github \
            --repoUrl "https://github.com/YCJE/Terminator" \
            --channel macos-stable \
            --token "${{ github.token }}" \
            --outputDir releases \
            --merge \
            --tag "v${{ env.VERSION }}"

      - name: Generate checksums
        shell: bash
        run: |
          cd releases
          # 生成除校验和文件自身外所有发布资产的 SHA256，供客户端校验下载完整性。
          # macOS 自带的是 BSD find（不支持 -printf）且没有 sha256sum，故用可移植写法。
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in SHA256SUMS-*) continue;; esac
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f"
            else
              shasum -a 256 "$f"
            fi
          done | sort -k2 > SHA256SUMS-macos.txt

      - name: Upload checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ env.VERSION }}" releases/SHA256SUMS-macos.txt --clobber