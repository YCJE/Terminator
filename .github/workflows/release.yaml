name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Build Wails App
        run: wails3 task build
        env:
          CGO_ENABLED: 1

      # 独立可执行文件（免安装版 + NSIS 安装包）是用户手动下载的主要入口，
      # 与历史版本的发布资产口径保持一致（应用内更新器另走 Velopack 产物）。
      # 放在 Velopack 之前：即使 Velopack 步骤失败，这两份文件也已完成发布。
      - name: Publish standalone executables
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ env.VERSION }}"
          NOTES="RELEASE_NOTES_v${{ env.VERSION }}.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
            else
              gh release create "$TAG" --title "$TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" \
            bin/terminator.exe \
            bin/terminator-amd64-installer.exe \
            --clobber

      - name: Velopack
        shell: bash
        run: |
          dotnet tool install -g vpk
          
          vpk download github \
            --repoUrl "https://github.com/YCJE/Terminator" \
            --channel windows-stable \
            --token "${{ github.token }}" \
            --outputDir releases || true
          
          vpk pack \
            --packId "Terminator" \
            --packVersion "${{ env.VERSION }}" \
            --packDir "bin" \
            --mainExe "terminator.exe" \
            --packTitle "Terminator" \
            --packAuthors "Terminator SSH" \
            --channel windows-stable \
            --icon "build/windows/icon.ico" \
            --outputDir releases

      - name: Get green checkmark
        uses: actions/attest@v4
        with:
          subject-path: |
            releases/*

      - name: Upload
        shell: bash
        run: |
          vpk upload github \
            --repoUrl "https://github.com/YCJE/Terminator" \
            --channel windows-stable \
            --token "${{ github.token }}" \
            --outputDir releases \
            --merge \
            --tag "v${{ env.VERSION }}"

      - name: Generate checksums
        shell: bash
        run: |
          cd releases
          # 生成除校验和文件自身外所有发布资产的 SHA256，供客户端校验下载完整性
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS-*' -printf '%f\n' | sort | while read -r f; do sha256sum "$f"; done > SHA256SUMS-windows.txt

      - name: Upload checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ env.VERSION }}" releases/SHA256SUMS-windows.txt --clobber

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - uses: ./.github/actions/setup

      - name: Build Wails App
        run: wails3 task build
        env:
          CGO_ENABLED: 1

      - name: Velopack
        shell: bash
        run: |
          dotnet tool install -g vpk
          
          vpk download github \
            --repoUrl "https://github.com/YCJE/Terminator" \
            --channel linux-stable \
            --token "${{ github.token }}" \
            --outputDir releases || true
          
          vpk pack \
            --packId "Terminator" \
            --packVersion "${{ env.VERSION }}" \
            --packDir "bin" \
            --mainExe "terminator" \
            --packTitle "Terminator" \
            --packAuthors "Terminator SSH" \
            --channel linux-stable \
            --icon "build/appicon.png" \
            --outputDir releases

      - name: Get green checkmark
        uses: actions/attest@v4
        with:
          subject-path: |
            releases/*

      - name: Upload
        shell: bash
        run: |
          vpk upload github \
            --repoUrl "https://github.com/YCJE/Terminator" \
            --channel linux-stable \
            --token "${{ github.token }}" \
            --outputDir releases \
            --merge \
            --tag "v${{ env.VERSION }}"

      - name: Generate checksums
        shell: bash
        run: |
          cd releases
          # 生成除校验和文件自身外所有发布资产的 SHA256，供客户端校验下载完整性
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS-*' -printf '%f\n' | sort | while read -r f; do sha256sum "$f"; done > SHA256SUMS-linux.txt

      - name: Upload checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ env.VERSION }}" releases/SHA256SUMS-linux.txt --clobber

  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Build Wails App
        run: wails3 task package
        env:
          CGO_ENABLED: 1

      - name: Velopack
        shell: bash
        run: |
          dotnet tool install -g vpk
          
          vpk download github \
            --repoUrl "https://github.com/YCJE/Terminator" \
            --channel macos-stable \
            --token "${{ github.token }}" \
            --outputDir releases || true
          
          APP_BUNDLE=$(find bin -maxdepth 1 -name "*.app" | head -n 1)
          
          vpk pack \
            --packId "Terminator" \
            --packVersion "${{ env.VERSION }}" \
            --packDir "$APP_BUNDLE" \
            --mainExe "terminator" \
            --packTitle "Terminator" \
            --packAuthors "Terminator SSH" \
            --channel macos-stable \
            --runtime osx-arm64 \
            --icon "build/darwin/icons.icns" \
            --outputDir releases

      - name: Get green checkmark
        uses: actions/attest@v4
        with:
          subject-path: |
            releases/*

      - name: Upload
        shell: bash
        run: |
          vpk upload github \
            --repoUrl "https://github.com/YCJE/Terminator" \
            --channel macos-stable \
            --token "${{ github.token }}" \
            --outputDir releases \
            --merge \
            --tag "v${{ env.VERSION }}"

      - name: Generate checksums
        shell: bash
        run: |
          cd releases
          # 生成除校验和文件自身外所有发布资产的 SHA256，供客户端校验下载完整性
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS-*' -printf '%f\n' | sort | while read -r f; do sha256sum "$f"; done > SHA256SUMS-macos.txt

      - name: Upload checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ env.VERSION }}" releases/SHA256SUMS-macos.txt --clobber